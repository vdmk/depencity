name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.4'
          python-version: '3.14'
      - run: uv sync --locked
      - run: uv run ruff check src tests scripts
      - run: uv run mypy
      - run: uv run scripts/check_docs.py
      - run: uv run scripts/update_fixture_profiles.py --check
      - run: uv run scripts/update_docs_links.py --check

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.4'
          python-version: '3.14'
      - run: uv sync --locked
      - run: uv run --locked bandit -c pyproject.toml -r src
      - run: uv run --locked pip-audit --local --skip-editable

  documentation-graphs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --platform linux/amd64 -f docker/docs/Dockerfile -t depencity-docs .
      - run: docker run --rm --platform linux/amd64 --network none -v "$PWD:/workspace:ro" depencity-docs --check

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hynek/build-and-inspect-python-package@2abe76da66d0a6a4a227101f9348ee855797cfa5

  tests:
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
        distribution: ['*.whl', '*.tar.gz']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.4'
          python-version: '3.14'
      - uses: actions/download-artifact@v4
        with:
          name: Packages
          path: dist
      - run: uvx --with tox-uv tox run --installpkg dist/${{ matrix.distribution }}
        shell: bash

  tag-release:
    needs: [lint, security, documentation-graphs, package, tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - name: Tag package version
        run: |
          version=$(python3 -c 'import runpy; print(runpy.run_path("src/depencity/_version.py")["__version__"])')
          tag="v${version}"
          existing_tag=$(git ls-remote --tags origin "refs/tags/${tag}")

          if [ -n "$existing_tag" ]; then
            echo "Tag ${tag} already exists"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "Release ${tag}"
          git push origin "${tag}"
