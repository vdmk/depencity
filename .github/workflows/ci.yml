name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.13.4'
          python-version: '3.14'
      - run: uv sync --locked
      - run: uv run ruff check src tests scripts
      - run: uv run mypy

      - run: uv run scripts/check_docs.py
      - run: uv run scripts/update_fixture_profiles.py --check
      - run: uv run scripts/update_docs_links.py --check

      - run: uv run --locked bandit -c pyproject.toml -r src
      - run: uv run --locked pip-audit --local --skip-editable

      - name: Build documentation image
        run: docker build --platform linux/amd64 -f docker/docs/Dockerfile -t depencity-docs .
      - name: Check documentation graphs
        run: docker run --rm --platform linux/amd64 --network none -v "$PWD:/workspace:ro" depencity-docs --check

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.13.4'
          python-version: '3.14'
      - name: Build distributions
        run: |
          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          uv build
      - name: Inspect distributions
        run: |
          uvx check-wheel-contents@0.6.3 dist/*.whl
          uvx twine@7.0.0 check --strict dist/*.whl dist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Packages
          if-no-files-found: error
          path: |
            dist/*.whl
            dist/*.tar.gz

  tests:
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
        distribution: ['*.whl', '*.tar.gz']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.13.4'
          python-version: '3.14'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Packages
          path: dist
      - run: uvx --with tox-uv tox run --installpkg dist/${{ matrix.distribution }}
        shell: bash

  tag-release:
    needs: [checks, package, tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-release-tag-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.publish }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.13.4'
          python-version: '3.14'
      - name: Tag package version
        id: release
        run: |
          version=$(uv version --short)
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          existing_tag=$(git ls-remote --tags origin "refs/tags/${tag}")

          if [ -n "$existing_tag" ]; then
            echo "Tag ${tag} already exists; leaving it unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${tag}" -m "Release ${tag}"
            git push origin "${tag}"
          fi

          # Allow reruns at the release commit to finish an interrupted publication,
          # even when tagging already succeeded. Later commits with the same
          # version skip publication; existing tags are never moved.
          git fetch origin "refs/tags/${tag}:refs/tags/${tag}"
          if [ "$(git rev-parse "${tag}^{commit}")" = "$GITHUB_SHA" ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo 'Version belongs to an earlier commit; skipping publication'
          fi

  sign-provenance:
    needs: tag-release
    if: needs.tag-release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      attestations: write
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.tag-release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify release tag
        run: |
          git fetch origin "refs/tags/v${RELEASE_VERSION}:refs/tags/v${RELEASE_VERSION}"
          test "$(git rev-parse "v${RELEASE_VERSION}^{commit}")" = "$GITHUB_SHA"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Packages
          path: release-dist
      - name: Validate tested distributions
        run: |
          shopt -s nullglob dotglob
          files=(release-dist/*)
          if (( ${#files[@]} != 2 )); then
            echo "::error::Expected exactly the release wheel and source archive in release-dist/"
            exit 1
          fi
          test -f "release-dist/depencity-${RELEASE_VERSION}-py3-none-any.whl"
          test -f "release-dist/depencity-${RELEASE_VERSION}.tar.gz"
      - name: Attest wheel build provenance
        id: wheel
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-dist/depencity-${{ env.RELEASE_VERSION }}-py3-none-any.whl
      - name: Attest sdist build provenance
        id: sdist
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-dist/depencity-${{ env.RELEASE_VERSION }}.tar.gz
      - name: Stage conversion inputs
        env:
          WHEEL_BUNDLE: ${{ steps.wheel.outputs.bundle-path }}
          SDIST_BUNDLE: ${{ steps.sdist.outputs.bundle-path }}
        run: |
          mkdir conversion-inputs
          cp "$WHEEL_BUNDLE" conversion-inputs/wheel.bundle
          cp "$SDIST_BUNDLE" conversion-inputs/sdist.bundle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Provenance inputs
          path: conversion-inputs/
          if-no-files-found: error
          overwrite: true

  convert-provenance:
    needs: sign-provenance
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: false
          version: '0.13.4'
          python-version: '3.14'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Provenance inputs
          path: inputs
      - name: Convert signed bundles for PyPI
        run: |
          mkdir attestations
          for kind in wheel sdist; do
            uvx pypi-attestations@0.0.31 convert "inputs/$kind.bundle" --output-file "attestations/$kind.attestation"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SLSA attestations
          path: attestations/
          if-no-files-found: error
          overwrite: true

  publish:
    needs: [tag-release, convert-provenance]
    if: needs.tag-release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.tag-release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify release tag
        run: |
          git fetch origin "refs/tags/v${RELEASE_VERSION}:refs/tags/v${RELEASE_VERSION}"
          test "$(git rev-parse "v${RELEASE_VERSION}^{commit}")" = "$GITHUB_SHA"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Packages
          path: release-dist
      - name: Validate tested distributions
        run: |
          shopt -s nullglob dotglob
          files=(release-dist/*)
          if (( ${#files[@]} != 2 )); then
            echo "::error::Expected exactly the release wheel and source archive in release-dist/"
            exit 1
          fi
          test -f "release-dist/depencity-${RELEASE_VERSION}-py3-none-any.whl"
          test -f "release-dist/depencity-${RELEASE_VERSION}.tar.gz"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: SLSA attestations
          path: converted
      - name: Stage SLSA attestations
        run: |
          cp converted/wheel.attestation "release-dist/depencity-${RELEASE_VERSION}-py3-none-any.whl.slsa.attestation"
          cp converted/sdist.attestation "release-dist/depencity-${RELEASE_VERSION}.tar.gz.slsa.attestation"
      - name: Publish tested distributions
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: release-dist/
          # Since our workflow doesn't move Git tags, we don't expect package contents to change on retries.
          skip-existing: true

  verify-release:
    needs: [tag-release, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.tag-release.outputs.version }}
    steps:
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.13.4'
          python-version: '3.14'
      - name: Verify published version
        run: |
          for attempt in {1..10}; do
            if output=$(uvx --isolated --refresh --python 3.14 --from "depencity==${RELEASE_VERSION}" depencity --version); then
              echo "$output"
              test "$output" = "depencity, version ${RELEASE_VERSION}"
              exit $?
            fi
            if [ "$attempt" -lt 10 ]; then sleep 15; fi
          done
          exit 1
